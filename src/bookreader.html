<dialog id="poetryReader" aria-label="顾城诗选">
  <div class="boundBook">
    <article class="bookPaper" data-side="left"><div class="pageMatter"></div><span class="pageNumber"></span></article>
    <article class="bookPaper" data-side="right"><div class="pageMatter"></div><span class="pageNumber"></span></article>
    <div class="poemRuler poemText" aria-hidden="true"></div>
    <button type="button" id="poemClose" aria-label="合上诗集" title="合上诗集">×</button>
    <button type="button" class="folioTurn" id="poemPrev" aria-label="上一页" title="上一页">‹</button>
    <button type="button" class="folioTurn" id="poemNext" aria-label="下一页" title="下一页">›</button>
  </div>
</dialog>
